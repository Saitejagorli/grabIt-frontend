<p-toast />
<form [formGroup]="productForm" (ngSubmit)="onSubmit()">
    <div class="flex flex-col sm:flex-row sm:items-center gap-3 sm:gap-0 mb-4">
        <div class="flex flex-col ml-2 gap-1">
            @if(isEditMode()) {
            <h1 class="text-2xl font-bold">Edit Product</h1>
            }
            @else {
            <h1 class="text-2xl font-bold">Add New Product</h1>
            }
        </div>
        <div class="flex flex-col sm:flex-row sm:ml-auto gap-2">
            <button type="button" pButton label="Cancel" severity="secondary" class="w-full sm:w-auto"></button>
            @if(isEditMode()) {
            <button type="submit" pButton label="Update Product"
                class="w-full sm:w-auto sm:ml-auto bg-primary-500 hover:bg-primary-600 text-white font-bold py-2 px-4 rounded transition-colors"
                [loading]="loading()" [disabled]="productForm.invalid || submitted()"></button>
            }
            @else {
            <button type="submit" pButton label="Save Product"
                class="w-full sm:w-auto sm:ml-auto bg-primary-500 hover:bg-primary-600 text-white font-bold py-2 px-4 rounded transition-colors"
                [loading]="loading()" [disabled]="productForm.invalid || productForm.pending || submitted()"></button>
            }
        </div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4 lg:gap-6">
        <div class="md:col-span-2 lg:col-span-3">
            <app-product-basic-info [mode]="mode()" [basicInfo]="productForm.controls.basicInfo" />
        </div>
        <div class="md:col-span-2 lg:col-span-2">
            <app-product-images [images]="productForm.controls.images" />
        </div>
        <div class="md:col-span-2 lg:col-span-3">
            <app-product-pricing [priceInfo]="productForm.controls.priceInfo" />
        </div>
        <div class="md:col-span-2 lg:col-span-2">
            <app-product-visibility [visibilityInfo]="productForm.controls.visibilityInfo" />
        </div>
    </div>
</form>

<p-card>
   <p-table [columns]="cols" [value]="products()" [totalRecords]="totalRecords()" size="large" stripedRows
      [paginator]="true" [lazy]="true" (onLazyLoad)="onLazyLoad($event)" lazyLoadOnInit="false" [rows]="size()"
      [first]="page() * size()" [rowsPerPageOptions]="[5, 10, 20]" showCurrentPageReport="true"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries">
      <ng-template #header let-columns>
         <tr>
            @for (col of columns; track $index) {
            <th>
               {{col.header}}
            </th>
            }
         </tr>
      </ng-template>
      <ng-template #body let-product>
         <tr>
            <td>
               <img [src]="getImageUrl(product.thumbnailImage)" alt="{{product.name}}" class="w-12 h-12">
            </td>
            <td>
               <span class="block max-w-[200px] truncate font-medium">
                  {{ product.name }}
               </span>
            </td>
            <td>
               <span class="block max-w-[150px] truncate text-sm">
                  {{ product.sku }}
               </span>
            </td>
            <td class="whitespace-nowrap">
               {{ product.brandName }}
            </td>
            <td>
               <span class="block max-w-[130px] truncate">
                  {{ product.categoryName }}
               </span>
            </td>
            <td class="whitespace-nowrap font-medium">
               {{product.sellingPrice | currency}}
            </td>
            <td>
               <p-tag [value]="product.status | titlecase" [severity]="getStatusClass(product.status)" [rounded]="true"
                  class="!px-4">
               </p-tag>
            </td>
            <td class="whitespace-nowrap">
               {{product.updatedAt | date:'dd MMM yyyy'}}</td>
            <td class="text-primary-500"><a [routerLink]="['/admin/products', product.id]">view</a></td>
         </tr>
      </ng-template>
   </p-table>
</p-card>

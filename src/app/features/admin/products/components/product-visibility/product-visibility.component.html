<p-card>
    <ng-template #header>
        <div class="flex align-items-center px-4 py-4 gap-2">
            <svg lucideEye class="text-primary-500"></svg>
            <h2 class="font-bold">Status & Visibility</h2>
        </div>
    </ng-template>
    <ng-template #content>
        <div [formGroup]="visibilityInfo()" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="flex flex-col gap-2">
                <label for="status">Product Status <span class="text-red-500">*</span></label>
                <p-selectbutton [options]="statusOptions" formControlName="status" size="large" styleClass="!w-full"
                    optionLabel="label" optionValue="value" />
                <app-field-error [control]="getControl('status')" label="Product Status"></app-field-error>
            </div>
            <div class="flex flex-col gap-2">
                <label for="visibility">Visibility <span class="text-red-500">*</span></label>
                <p-selectbutton [options]="visibilityOptions" formControlName="visibility" size="large"
                    styleClass="!w-full" optionLabel="label" optionValue="value" />
                <app-field-error [control]="getControl('visibility')" label="Visibility"></app-field-error>
            </div>
        </div>
    </ng-template>
</p-card>
